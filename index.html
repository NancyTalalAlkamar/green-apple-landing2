<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: العنوان والوصف اللي بيطلعوا بجوجل -->
    <title>Green Apple · عيادة تنحيف ونحت جسم في سخنين</title>
    <meta
      name="description"
      content="Green Apple — عيادة تنحيف ونحت جسم غير جراحي في سخنين. برنامج شخصي يبدأ باستشارة، مع خطة جلسات ومتابعة وقياسات ثابتة."
    />
    <meta name="theme-color" content="#14291f" />
    <!-- مؤقت: بيمنع جوجل يأرشف الموقع لحد الإطلاق الرسمي (فيه محتوى تجريبي). احذفي هاد السطر يوم الإطلاق -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/images/logo-mark.png" />
    <link rel="apple-touch-icon" href="/images/logo-mark.png" />

    <!-- الصورة والنص اللي بيطلعوا لما حدا يبعت الرابط على واتساب/فيسبوك -->
    <!-- لما يصير في دومين حقيقي، بدّلي الرابط بالسطرين og:url و og:image -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_IL" />
    <meta property="og:site_name" content="Green Apple" />
    <meta property="og:title" content="Green Apple · عيادة تنحيف ونحت جسم في سخنين" />
    <meta property="og:description" content="جسمك يستحق عناية، بلا جراحة. برنامج شخصي بخطة ومتابعة وقياس." />
    <meta property="og:url" content="https://green-apple-landing2-pps8.vercel.app/" />
    <meta property="og:image" content="https://green-apple-landing2-pps8.vercel.app/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Green Apple — عيادة تنحيف ونحت جسم" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- معلومات العيادة لجوجل (Schema) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HealthAndBeautyBusiness",
        "name": "Green Apple",
        "description": "عيادة تنحيف ونحت جسم غير جراحي في سخنين",
        "url": "https://green-apple-landing2-pps8.vercel.app/",
        "image": "https://green-apple-landing2-pps8.vercel.app/images/og-image.jpg",
        "logo": "https://green-apple-landing2-pps8.vercel.app/images/logo-mark.png",
        "telephone": "+972592373805",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Sakhnin",
          "addressCountry": "IL"
        },
        "areaServed": "Sakhnin"
      }
    </script>

    <link rel="preload" as="image" href="/images/hero.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- فحص مؤقت: إذا الموقع ما اشتغل، بيطلع مربع فيه سبب المشكلة -->
    <script>
      (function () {
        var shown = false
        function show(msg) {
          if (shown) return
          shown = true
          var box = document.createElement('div')
          box.setAttribute('style', 'position:fixed;inset:auto 12px 12px 12px;z-index:99999;background:#fff3f0;color:#7a1f10;border:2px solid #c0391b;border-radius:14px;padding:14px;font:14px/1.6 -apple-system,sans-serif;direction:ltr;text-align:left;word-break:break-word')
          box.innerHTML = '<b>الموقع ما اشتغل، صوّروا هاي الشاشة وابعتوها:</b><br>' + String(msg).replace(/</g, '&lt;') + '<br><br><small>' + navigator.userAgent + '</small>'
          ;(document.body || document.documentElement).appendChild(box)
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''))
        })
        window.addEventListener('unhandledrejection', function (e) {
          show('promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason))
        })
        setTimeout(function () {
          var r = document.getElementById('root')
          if (r && !r.children.length) show('الصفحة ما انرسمت بعد 8 ثواني')
        }, 8000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
