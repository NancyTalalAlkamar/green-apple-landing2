<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Green Apple — عيادة تنحيف ونحت جسم في سخنين. برنامج شخصي بخطة ومتابعة وقياس." />
    <link rel="icon" type="image/png" href="/images/logo-mark.png" />
    <link rel="preload" as="image" href="/images/hero.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Green Apple · عيادة تنحيف ونحت جسم</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- فحص مؤقت: إذا الموقع ما اشتغل، بيطلع مربع فيه سبب المشكلة -->
    <script>
      (function () {
        var shown = false
        function show(msg) {
          if (shown) return
          shown = true
          var box = document.createElement('div')
          box.setAttribute('style', 'position:fixed;inset:auto 12px 12px 12px;z-index:99999;background:#fff3f0;color:#7a1f10;border:2px solid #c0391b;border-radius:14px;padding:14px;font:14px/1.6 -apple-system,sans-serif;direction:ltr;text-align:left;word-break:break-word')
          box.innerHTML = '<b>الموقع ما اشتغل، صوّروا هاي الشاشة وابعتوها:</b><br>' + String(msg).replace(/</g, '&lt;') + '<br><br><small>' + navigator.userAgent + '</small>'
          ;(document.body || document.documentElement).appendChild(box)
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''))
        })
        window.addEventListener('unhandledrejection', function (e) {
          show('promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason))
        })
        setTimeout(function () {
          var r = document.getElementById('root')
          if (r && !r.children.length) show('الصفحة ما انرسمت بعد 8 ثواني')
        }, 8000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
